<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lacinho – Minha gatinha virtual</title>
<style>
:root{--b1:#ffe6f1;--b2:#ffb3d3;--panel:rgba(255,255,255,.9);--ink:#6b2a4d;--bar:#ff5c9a;--track:#ffd3e6;--btn:#ff7fb0;--btnink:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#3a1f3d;--b2:#1d1330;--panel:rgba(50,28,58,.9);--ink:#ffd9ec;--track:#5a3262}}
:root[data-theme="dark"]{--b1:#3a1f3d;--b2:#1d1330;--panel:rgba(50,28,58,.9);--ink:#ffd9ec;--track:#5a3262}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--b1),var(--b2));color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;transition:background 1s}
body.night{--b1:#241a52;--b2:#0b0a25}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
.st{background:var(--panel);border-radius:14px;padding:5px 9px;display:flex;align-items:center;gap:6px;font-size:15px;min-width:92px}
.tr{flex:1;height:9px;background:var(--track);border-radius:9px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--bar);border-radius:9px;transition:width .3s}
.st.low .tr i{background:#ff3b3b}
#coins{font-weight:800}
#bubble{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:18px;font-size:17px;font-weight:700;max-width:86vw;text-align:center;pointer-events:none}
#menu{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;justify-content:center}
#menu button,#foods button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:18px;background:var(--btn);color:var(--btnink);padding:10px 14px;min-width:74px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#menu button span{font-size:26px;line-height:1}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
body.busy #menu button:not(.keep){opacity:.45;pointer-events:none}
#foods{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 98px);background:var(--panel);padding:10px;border-radius:22px;display:none;gap:8px}
#foods.on{display:flex}
#foods button{background:var(--track);color:var(--ink);min-width:78px}
#foods button span{font-size:30px}
#game{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:0;right:0;display:none;justify-content:center;gap:12px;pointer-events:none;font-weight:800;font-size:20px}
#game b{background:var(--panel);padding:6px 14px;border-radius:16px}
.fl{position:fixed;font-size:26px;pointer-events:none;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-90px) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.fl{animation-duration:.01s}}
#menu{gap:6px}#menu button{min-width:0;flex:1;max-width:84px;padding:10px 4px}
#dress{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:linear-gradient(var(--b1),var(--b2))}
#dress.on{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800}
#dress button{font:inherit;font-weight:800;font-size:12px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);padding:6px 10px;cursor:pointer;white-space:nowrap}
#dress button.sel{background:var(--btn);color:var(--btnink)}
#dress .row{display:flex;gap:6px;overflow-x:auto;padding:2px}
#dress .row button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:60px}
#dress .row button span{font-size:24px;line-height:1.1}
#dsv{position:relative;inset:auto;flex:1 1 240px;min-height:180px;max-height:42vh;width:100%;height:34vh;border-radius:22px;display:block;background:linear-gradient(#fff0f7,#f7e9ff);touch-action:none;pointer-events:auto;z-index:1;cursor:grab}
#dress .sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid #fff}
#dact{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex:0 0 auto}
@media(max-height:650px){#dsv{min-height:135px;max-height:32vh;flex-basis:150px}#dress{gap:4px;padding-top:5px;padding-bottom:5px}#dress .row button{min-width:54px;padding:5px 8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="st" id="s-hunger">🍓<div class="tr"><i></i></div></div>
  <div class="st" id="s-fun">💖<div class="tr"><i></i></div></div>
  <div class="st" id="s-energy">⚡<div class="tr"><i></i></div></div>
  <div class="st" id="s-clean">🫧<div class="tr"><i></i></div></div>
  <div class="st" id="coins">🪙 <span id="cn">0</span></div>
</div>
<div id="bubble"></div>
<div id="game"><b id="gs">❤ 0</b><b id="gt">20s</b></div>
<div id="foods"></div>
<div id="gamepick" style="position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:#512b4b88;padding:18px">
 <div style="background:var(--panel);color:var(--ink);border-radius:24px;padding:18px;max-width:420px;width:100%;text-align:center">
  <h2 style="margin:4px 0 12px">🎮 Hora de brincar!</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
   <button data-game="catch">💗 Pega-corações</button><button data-game="bubble">🫧 Estoura-bolhas</button>
   <button data-game="memory">🧠 Jogo da memória</button><button data-game="dance">💃 Dança maluca</button>
  </div>
  <button id="gameclose" style="margin-top:12px;background:var(--track);color:var(--ink)">Voltar</button>
 </div>
</div>
<div id="minigame" style="position:fixed;inset:0;z-index:18;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#ffe4f1ee,#e9dcffee);padding:18px;color:#6b2a4d">
 <h2 id="mgtitle">Minigame</h2><div style="font-weight:900;font-size:22px" id="mgscore">⭐ 0</div>
 <div id="mgarea" style="width:min(92vw,440px);height:min(55vh,420px);background:#ffffffb8;border:3px solid #ffc0dc;border-radius:24px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px"></div>
 <button id="mgexit" style="background:#ff7fb0;color:white;border:0;border-radius:16px;padding:10px 18px;font:inherit;font-weight:800">Sair da brincadeira</button>
</div>
<div id="menu">
  <button id="b-eat"><span>🍓</span>Comer</button>
  <button id="b-bath"><span>🛁</span>Banho</button>
  <button id="b-play"><span>🎮</span>Brincar</button>
  <button id="b-dress"><span>👗</span>Vestir</button>
  <button id="b-sleep" class="keep"><span>😴</span><em style="font-style:normal" id="sl">Dormir</em></button>
</div>

<div id="dress"><div class="dh"><b>Ateliê Sanrio ✨</b><button id="dx" aria-label="Fechar">✖</button></div>
<div class="row" id="dchars"></div><canvas id="dsv" role="img" aria-label="Prévia 3D do personagem; arraste para girar"></canvas><div style="text-align:center;font-size:12px;font-weight:700;opacity:.8">☝️ Arraste a gatinha para girar e ver seu look em 3D</div>
<div class="row" id="dtabs"></div><div class="row" id="ditems"></div><div class="row" id="dcols"></div>
<div id="dact"><button id="dr">🎲 Sortear</button><button id="dc">🧹 Limpar</button><button id="dbg">🖼️ Fundo</button><button id="dok">✅ Pronto!</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), clamp=(v,a=0,b=100)=>Math.min(b,Math.max(a,v));
let S={hunger:70,fun:70,energy:80,clean:80,coins:5,t:Date.now()};
try{const r=JSON.parse(localStorage.getItem('lacinho'));if(r){S=Object.assign(S,r);const el=Math.min((Date.now()-r.t)/1000,28800);
['hunger','fun','energy','clean'].forEach(k=>S[k]=Math.max(Math.min(S[k],15),S[k]-el*.004));}}catch(e){}
const save=()=>{try{S.t=Date.now();localStorage.setItem('lacinho',JSON.stringify(S))}catch(e){}};

// ---------- cena ----------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(45,1,.1,100);
const amb=new THREE.AmbientLight(0xffffff,.75), sun=new THREE.DirectionalLight(0xfff0f5,.7);
sun.position.set(3,6,5);scene.add(amb,sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};

const floor=mesh(new THREE.CylinderGeometry(5.5,5.5,.3,48),M(0xffc4dc),0,-.15,0);scene.add(floor);
const rug=mesh(new THREE.CylinderGeometry(2.6,2.6,.04,48),M(0xfff4f9),0,.02,0);scene.add(rug);
const shadow=mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0x8a3b62,transparent:true,opacity:.18}),0,.06,0);
shadow.rotation.x=-Math.PI/2;shadow.scale.set(1.2,.9,1);scene.add(shadow);

function heartGeo(){const s=new THREE.Shape();s.moveTo(0,-.5);s.bezierCurveTo(-.9,.1,-.5,.9,0,.4);s.bezierCurveTo(.5,.9,.9,.1,0,-.5);
 const g=new THREE.ExtrudeGeometry(s,{depth:.25,bevelEnabled:true,bevelSize:.06,bevelThickness:.06,bevelSegments:2});g.center();return g}
const HG=heartGeo();
const deco=[];
for(let i=0;i<8;i++){const h=mesh(HG,M(i%2?0xffa6c9:0xffd1e3),(Math.random()-.5)*9,1.5+Math.random()*3.5,-2.5-Math.random()*2);
 h.scale.setScalar(.35+Math.random()*.35);h.userData={p:Math.random()*6,y:h.position.y};scene.add(h);deco.push(h)}

// ---------- gatinha ----------
const pet=new THREE.Group();scene.add(pet);
const white=M(0xffffff,{roughness:.45}), pink=M(0xff4f8b), black=M(0x2a1a22,{roughness:.3});
const wear=new THREE.Group();pet.add(wear);
const characterExtra=new THREE.Group();pet.add(characterExtra);
const characterColors={kitty:0xffffff,melody:0xffd1e3,sweet:0xffc1dc,purin:0xffdf83,kuromi:0xe4d9f2};
let currentCharacter='kitty';
const body=mesh(new THREE.SphereGeometry(1,40,32),white,0,1.2,0);body.scale.set(1.15,1,1);pet.add(body);
const earL=mesh(new THREE.ConeGeometry(.32,.6,24),white,-.68,2.05,0), earR=earL.clone();earR.position.x=.68;pet.add(earL,earR);
const bow=new THREE.Group();bow.position.set(.78,1.95,.4);bow.rotation.z=-.25;
const w1=mesh(new THREE.ConeGeometry(.24,.42,20),pink,-.22,0,0);w1.rotation.z=-Math.PI/2;
const w2=mesh(new THREE.ConeGeometry(.24,.42,20),pink,.22,0,0);w2.rotation.z=Math.PI/2;
bow.add(w1,w2,mesh(new THREE.SphereGeometry(.12,16,12),M(0xe0356f)));pet.add(bow);
const eyes=[-1,1].map(s=>{const e=mesh(new THREE.SphereGeometry(.1,16,12),black,s*.42,1.28,.92);e.scale.set(1,1.5,.6);pet.add(e);return e});
const nose=mesh(new THREE.SphereGeometry(.09,16,12),M(0xffcf2e),0,1.12,.98);nose.scale.set(1.4,.9,.7);pet.add(nose);
const mouth=mesh(new THREE.SphereGeometry(.14,16,12),M(0xc2335f),0,.92,.94);mouth.scale.set(1,.7,.4);mouth.visible=false;pet.add(mouth);
[-1,1].forEach(s=>{const c=mesh(new THREE.SphereGeometry(.16,16,12),M(0xffb3cc),s*.66,1.05,.78);c.scale.set(1,.6,.3);pet.add(c);
 for(let i=0;i<3;i++){const w=mesh(new THREE.CylinderGeometry(.014,.014,.55,6),black,s*1.2,1.2+(i-1)*.13,.45);w.rotation.z=Math.PI/2+s*(i-1)*.18;pet.add(w)}
 pet.add(mesh(new THREE.SphereGeometry(.22,16,12),white,s*.5,.22,.55));
 pet.add(mesh(new THREE.SphereGeometry(.2,16,12),white,s*1.08,.95,.25));});

// ---------- estado do jogo ----------
let mode='idle',t=0,tapT=0,hop=0,blink=2,px=0,py=0,msg='',msgT=0,eatT=0,food=null,bathT=0,items=[],bubbles=[],score=0,timeLeft=0,spawnT=0,xr=3;
const say=(m,d=2)=>{msg=m;msgT=d};

const FOODS=[{e:'🍓',n:'Morango',c:0,v:15},{e:'🍩',n:'Rosquinha',c:2,v:28},{e:'🍰',n:'Bolo',c:4,v:45}];
FOODS.forEach((f,i)=>{const b=document.createElement('button');b.innerHTML='<span>'+f.e+'</span>'+f.n+'<small>'+(f.c?'🪙 '+f.c:'grátis')+'</small>';b.onclick=()=>feed(f);$('foods').appendChild(b)});
function makeFood(e){const g=new THREE.Group();
 if(e==='🍓'){g.add(mesh(new THREE.SphereGeometry(.26,16,12),M(0xff2d4f)));g.children[0].scale.y=1.2;g.add(mesh(new THREE.ConeGeometry(.15,.15,8),M(0x39b54a),0,.3,0))}
 else if(e==='🍩'){const d=mesh(new THREE.TorusGeometry(.24,.11,12,24),M(0xf0a35e));d.rotation.x=1.2;g.add(d);const i=mesh(new THREE.TorusGeometry(.24,.12,12,24,5),M(0xff8fb8),0,.04,0);i.rotation.x=1.2;g.add(i)}
 else{g.add(mesh(new THREE.CylinderGeometry(.3,.3,.3,20),M(0xfff0d0)),mesh(new THREE.SphereGeometry(.28,16,10,0,6.3,0,1.5),M(0xff8fb8),0,.15,0),mesh(new THREE.SphereGeometry(.06,10,8),M(0xff2d4f),0,.45,0))}
 return g}
$('b-eat').onclick=()=>{if(mode==='idle')$('foods').classList.toggle('on')};
function feed(f){if(mode!=='idle')return;if(S.coins<f.c){say('Faltam moedinhas 🪙');return}
 S.coins-=f.c;$('foods').classList.remove('on');mode='eat';eatT=0;food={m:makeFood(f.e),v:f.v};scene.add(food.m);busy(true)}
$('b-bath').onclick=()=>{if(mode!=='idle')return;$('foods').classList.remove('on');mode='bath';bathT=0;busy(true)};
$('b-sleep').onclick=()=>{$('foods').classList.remove('on');
 if(mode==='sleep'){mode='idle';busy(false)}else if(mode==='idle'){mode='sleep';busy(true)}};
$('b-play').onclick=()=>{if(mode!=='idle')return;if(S.energy<15){say('Estou cansada demais 😴');return}
 $('foods').classList.remove('on');$('gamepick').style.display='flex'};
$('gameclose').onclick=()=>$('gamepick').style.display='none';
let mgTimer=null,mgScore=0,mgGame='';
function endMini(){
 if(mgTimer)clearInterval(mgTimer);mgTimer=null;
 $('minigame').style.display='none';$('gamepick').style.display='none';
 S.fun=clamp(S.fun+Math.max(4,mgScore));S.energy=clamp(S.energy-5);S.coins+=Math.max(1,Math.floor(mgScore/3));
 save();say('Que diversão! Você ganhou '+Math.max(1,Math.floor(mgScore/3))+' moedinha(s)! 💖',3);
}
function startMini(kind){
 mgGame=kind;mgScore=0;$('mgscore').textContent='⭐ 0';$('gamepick').style.display='none';$('minigame').style.display='flex';
 const area=$('mgarea');area.innerHTML='';
 if(kind==='catch'){
  $('minigame').style.display='none';mode='play';score=0;timeLeft=20;spawnT=0;busy(true);$('game').style.display='flex';return;
 }
 if(kind==='bubble'){
  $('mgtitle').textContent='🫧 Estoura-bolhas — toque nas bolhas!';
  for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=['🫧','💗','✨'][i%3];b.style.cssText='font-size:34px;border:0;background:#ffe0ef;border-radius:50%;width:64px;height:64px;cursor:pointer';b.onclick=()=>{if(!b.isConnected)return;mgScore++;$('mgscore').textContent='⭐ '+mgScore;b.remove();if(!area.children.length)endMini()};area.appendChild(b)}
 }else if(kind==='memory'){
  $('mgtitle').textContent='🧠 Ache os pares iguais!';
  const vals=['🎀','🐰','🍮','💜','🌸','⭐','🎀','🐰','🍮','💜','🌸','⭐'].sort(()=>Math.random()-.5);
  let opened=[],locked=false,matched=0;
  vals.forEach(v=>{const b=document.createElement('button');b.textContent='❔';b.dataset.v=v;b.style.cssText='font-size:25px;width:58px;height:62px;border:0;border-radius:14px;background:#ffd5e8';b.onclick=()=>{if(locked||b.dataset.done||b.textContent!=='❔')return;b.textContent=v;opened.push(b);if(opened.length===2){locked=true;if(opened[0].dataset.v===opened[1].dataset.v){opened.forEach(x=>x.dataset.done='1');matched++;mgScore+=2;$('mgscore').textContent='⭐ '+mgScore;opened=[];locked=false;if(matched===6)endMini()}else setTimeout(()=>{opened.forEach(x=>x.textContent='❔');opened=[];locked=false},650)}};area.appendChild(b)});
 }else if(kind==='dance'){
  $('mgtitle').textContent='💃 Dança maluca — siga os comandos!';
  const moves=['⬅️ Esquerda','➡️ Direita','⬆️ Pula','💖 Rebola'];
  let n=0;
  const prompt=document.createElement('div');prompt.style.cssText='width:100%;font-size:26px;font-weight:900;text-align:center';area.appendChild(prompt);
  const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:8px;justify-content:center';area.appendChild(buttons);
  function next(){prompt.textContent=moves[Math.floor(Math.random()*moves.length)];}
  moves.forEach(m=>{const b=document.createElement('button');b.textContent=m;b.style.cssText='padding:12px;border:0;border-radius:14px;background:#ffd5e8;font:inherit;font-weight:800';b.onclick=()=>{mgScore++;$('mgscore').textContent='⭐ '+mgScore;next();if(mgScore>=10)endMini()};buttons.appendChild(b)});next();
 }
 mgTimer=setTimeout(endMini,30000);
}
$('gamepick').addEventListener('click',e=>{const b=e.target.closest('[data-game]');if(b)startMini(b.dataset.game)});
$('mgexit').onclick=endMini;
function busy(b){document.body.classList.toggle('busy',b);document.body.classList.toggle('night',mode==='sleep');$('sl').textContent=mode==='sleep'?'Acordar':'Dormir'}

function spawnItem(){const bad=Math.random()<.22;
 const m=bad?mesh(new THREE.DodecahedronGeometry(.3),M(0x3c9a3c)):mesh(HG,M(Math.random()<.5?0xff4f8b:0xff86b3));
 if(!bad)m.scale.setScalar(.6);m.position.set((Math.random()*2-1)*xr,6,.3);scene.add(m);items.push({m,bad})}
function bubbleFx(){const m=mesh(new THREE.SphereGeometry(.08+Math.random()*.14,12,10),M(0xffffff,{transparent:true,opacity:.65,roughness:.1}),
 (Math.random()-.5)*2.4,.4+Math.random()*2,(Math.random()-.2)*1.6);scene.add(m);bubbles.push({m,life:1.4,vy:.8+Math.random()})}

// ---------- entrada ----------
addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1;py=-(e.clientY/innerHeight*2-1)});
const ray=new THREE.Raycaster();
$('c').addEventListener('pointerdown',e=>{px=e.clientX/innerWidth*2-1;py=-(e.clientY/innerHeight*2-1);
 if(mode==='play'||mode==='sleep')return;
 ray.setFromCamera({x:px,y:py},cam);
 if(ray.intersectObject(pet,true).length){tapT=1;S.fun=clamp(S.fun+2);
  const h=document.createElement('div');h.className='fl';h.textContent='💗';h.style.left=e.clientX-12+'px';h.style.top=e.clientY-30+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1000);
  if(Math.random()<.12){S.coins++;say('Ganhou 1 moedinha! 🪙')}}});
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);cam.aspect=a;
 cam.position.set(0,2.8,a<1?7.2+(1-a)*5:7.2);cam.updateProjectionMatrix();
 xr=Math.min(3.4,Math.tan(.3927)*cam.position.z*a*.8)}
addEventListener('resize',()=>{resize();if($('dress').classList.contains('on'))renderPreview()});resize();

// ---------- loop ----------
let last=performance.now(),saveT=0,lowest=null;
function update(dt){
 t+=dt;const sl=mode==='sleep';
 // necessidades
 S.hunger=clamp(S.hunger-dt*(sl?.1:.35));S.fun=clamp(S.fun-dt*(sl?.05:.3));S.clean=clamp(S.clean-dt*.2);
 S.energy=sl?clamp(S.energy+dt*6):clamp(S.energy-dt*.18);
 if(sl&&S.energy>=100){mode='idle';busy(false);say('Bom dia! ☀️',3)}
 // comer
 if(mode==='eat'){eatT+=dt;const k=Math.min(eatT/.8,1);
  if(food.m){food.m.position.set(2.4*(1-k),3.4+(1.0-3.4)*k+Math.sin(k*Math.PI)*.9,1.4*(1-k)+1.05*k);food.m.rotation.y+=dt*4;
   if(k>=1){scene.remove(food.m);food.m=null}}

let previewRenderer;
try{previewRenderer=new THREE.WebGLRenderer({canvas:$('dsv'),antialias:true,alpha:true});previewRenderer.setPixelRatio(Math.min(devicePixelRatio||1,2));}
catch(err){$('dsv').style.display='none';console.warn('Prévia 3D indisponível:',err)}
const previewScene=new THREE.Scene();previewScene.background=new THREE.Color(0xfff0f7);
previewScene.add(new THREE.HemisphereLight(0xffffff,0xe8a9c9,2));
const previewLight=new THREE.DirectionalLight(0xffffff,2);previewLight.position.set(3,5,6);previewScene.add(previewLight);
const previewCam=new THREE.PerspectiveCamera(36,1,.1,100);previewCam.position.set(0,2.4,7);previewCam.lookAt(0,1.2,0);
let previewPet=pet.clone(true);previewScene.add(previewPet);
const previewFloor=mesh(new THREE.CylinderGeometry(2.4,2.4,.12,40),M(0xffc9df),0,-.15,0);previewScene.add(previewFloor);
let previewW=0,previewH=0,previewAngle=0,draggingPreview=false,lastPreviewX=0;
const previewCanvas=$('dsv');
previewCanvas.addEventListener('pointerdown',e=>{draggingPreview=true;lastPreviewX=e.clientX;previewCanvas.setPointerCapture?.(e.pointerId);previewCanvas.style.cursor='grabbing'});
previewCanvas.addEventListener('pointermove',e=>{if(!draggingPreview)return;previewAngle+=(e.clientX-lastPreviewX)*.012;lastPreviewX=e.clientX;if(previewPet)previewPet.rotation.y=previewAngle});
const stopPreviewDrag=()=>{draggingPreview=false;previewCanvas.style.cursor='grab'};
previewCanvas.addEventListener('pointerup',stopPreviewDrag);previewCanvas.addEventListener('pointercancel',stopPreviewDrag);previewCanvas.addEventListener('lostpointercapture',stopPreviewDrag);
function renderPreview(){
 if(!previewRenderer)return;
 const canvas=$('dsv');const w=Math.max(1,canvas.clientWidth||300),h=Math.max(1,canvas.clientHeight||240);
 if(w!==previewW||h!==previewH){previewW=w;previewH=h;previewRenderer.setSize(w,h,false);previewCam.aspect=w/h;previewCam.updateProjectionMatrix();}
 if(previewPet&&!draggingPreview)previewPet.rotation.y=previewAngle+Math.sin(performance.now()*.0005)*.035;
 previewRenderer.render(previewScene,previewCam);
}

 else if(id==='dbg')D.bg=(D.bg+1)%BG.length;
 else if(id==='dc'){D.cl=D.ht='';D.mk=[];D.ac=[]}
